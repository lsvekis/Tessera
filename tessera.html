<title>Tessera Tribes</title>
<meta name="description" content="A turn-based tribal conquest game: explore, build gold-making buildings, research a tech tree and conquer rival tribes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --ink:#070b17; --plate:#131b35; --plate2:#1b2649; --plate3:#223060; --line:#2b3b6c; --text:#eef2ff; --muted:#98a4ca; --dim:#6c78a0;
  --gold:#ffcf3f; --gold2:#ffae00; --good:#4fdc8a; --bad:#ff5d6c; --warn:#ffb547; --violet:#c38bff;
  --food:#ff9a57; --wood:#d39a62; --coin:#ffd54a;
  --cut:10px; --fd:'Lilita One','Trebuchet MS',system-ui,sans-serif; --fb:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:14px/1.4 var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;overflow:hidden}
#bg,#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{touch-action:none;cursor:default}
#cv.grab{cursor:grabbing}
.cut{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.plate{background:linear-gradient(180deg,rgba(29,40,78,.97),rgba(15,21,43,.97));box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.btn{--c1:#2a3970;--c2:#1b2650;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;padding:10px 16px;
  background:linear-gradient(180deg,var(--c1),var(--c2));color:var(--text);font-weight:600;letter-spacing:.01em;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.primary{--c1:#ffd95c;--c2:#ffab00;color:#2a1a00;font-weight:800}
.btn.danger{--c1:#ff7a86;--c2:#d63447;color:#2b0006}
.btn.ghost{--c1:transparent;--c2:transparent;color:var(--muted)}
.btn.big{padding:13px 22px;font-size:16px}
.btn[disabled]{filter:grayscale(.7) brightness(.7);cursor:not-allowed}
.btn small{font-weight:500;opacity:.85}
[hidden]{display:none!important}

/* ---------- menu ---------- */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
#menu{background:radial-gradient(ellipse 46% 52% at 50% 50%,rgba(5,8,18,.86),rgba(5,8,18,.55) 55%,rgba(5,8,18,.2) 100%)}
.menu-inner{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:560px}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.86;filter:drop-shadow(0 8px 0 rgba(0,0,0,.35));animation:logoFloat 6s ease-in-out 2s infinite}
@keyframes logoFloat{50%{transform:translateY(-7px)}}
.logo-main{display:flex;font:clamp(56px,13vw,112px)/.9 var(--fd);letter-spacing:.04em}
.logo-main i{font-style:normal;display:inline-block;background:linear-gradient(180deg,#fff8d8 0%,#ffd84f 38%,#ff9f1c 68%,#ffd24a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px rgba(60,30,0,.35);
  animation:dropIn .9s cubic-bezier(.2,1.5,.4,1) backwards,glint 6s ease-in-out infinite;animation-delay:calc(var(--i)*80ms + 150ms),calc(var(--i)*110ms + 2.2s)}
@keyframes dropIn{0%{transform:translateY(-100px) rotate(-16deg) scale(.4);opacity:0}60%{opacity:1}}
@keyframes glint{0%,80%,100%{filter:brightness(1)}87%{filter:brightness(1.7) drop-shadow(0 0 12px rgba(255,214,90,.95))}}
.logo-sub{font:clamp(22px,5vw,38px)/1 var(--fd);letter-spacing:.55em;margin-right:-.55em;color:#cfe0ff;margin-top:6px;animation:trackIn 1.3s cubic-bezier(.2,.8,.2,1) .8s backwards}
@keyframes trackIn{from{letter-spacing:1.5em;margin-right:-1.5em;opacity:0}}
.tagline{animation:fadeUp .8s ease-out 1.1s backwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
.menu-fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.fx-d{position:absolute;bottom:-40px;width:var(--s);height:var(--s);background:var(--c);border-radius:3px;opacity:0;box-shadow:0 0 16px var(--c);animation:fxUp var(--d) linear var(--dl) infinite}
@keyframes fxUp{0%{transform:translateY(0) rotate(45deg);opacity:0}12%{opacity:.45}85%{opacity:.3}100%{transform:translateY(-118vh) rotate(405deg);opacity:0}}
.mb{animation:rise .75s cubic-bezier(.2,1.25,.3,1) backwards;animation-delay:calc(var(--k)*110ms + 1.2s);transition:transform .2s ease,filter .2s ease}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.92)}}
.mb:hover{transform:translateY(-3px) scale(1.025);filter:drop-shadow(0 10px 16px rgba(0,0,0,.45)) drop-shadow(0 0 14px rgba(120,160,255,.45))}
.mb.hero{animation:rise .75s cubic-bezier(.2,1.25,.3,1) backwards,heroGlow 2.4s ease-in-out infinite;animation-delay:calc(var(--k)*110ms + 1.2s),2.2s}
@keyframes heroGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(255,190,40,.25))}50%{filter:drop-shadow(0 0 24px rgba(255,190,40,.8))}}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.5) 47%,rgba(255,255,255,.12) 55%,transparent 70%);transform:translateX(-135%);pointer-events:none}
.btn:hover::after{transition:transform .7s ease;transform:translateX(135%)}
.mb.hero .btn::after{animation:sweep 3.6s ease-in-out 2.6s infinite}
@keyframes sweep{0%{transform:translateX(-135%)}32%,100%{transform:translateX(135%)}}
.tribe-strip span{animation:bob 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*.15s)}
@keyframes bob{0%,100%{transform:rotate(45deg)}50%{transform:rotate(45deg) translate(-4px,-4px)}}
.menu-foot{animation:fadeUp .8s ease-out 1.9s backwards}
.tribe-strip{animation:fadeUp .8s ease-out 1.7s backwards}
.snd-btn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:9;display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;padding:8px 14px 8px 10px;
  background:rgba(19,27,53,.88);color:#e3e9ff;font-weight:600;font-size:13px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.snd-btn svg{width:20px;height:20px}
.snd-btn.off{color:var(--muted)}
.snd-btn:focus-visible{outline:2px solid var(--gold)}
.tribe-grid.enter .tcard{animation:cardIn .6s cubic-bezier(.2,1.2,.3,1) backwards;animation-delay:calc(var(--k)*70ms + 60ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.95)}}
.tcard.sel{animation:selPulse 1.8s ease-in-out infinite}
.tribe-grid.enter .tcard.sel{animation:cardIn .6s cubic-bezier(.2,1.2,.3,1) backwards,selPulse 1.8s ease-in-out infinite;animation-delay:calc(var(--k)*70ms + 60ms),.8s}
@keyframes selPulse{0%,100%{box-shadow:inset 0 0 0 3px var(--gold)}50%{box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 30px rgba(255,207,63,.35)}}
.tcard.sel .band img{animation:hop .9s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-5px)}}
#loader{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;overflow:hidden;
  padding:calc(34px + env(safe-area-inset-top,0px)) 16px calc(26px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(ellipse 70% 60% at 50% 50%,var(--tcg,rgba(80,110,200,.3)) 0%,rgba(6,9,19,0) 70%),#060913;opacity:0;transition:opacity .4s ease}
#loader.in{opacity:1}
#loader.out{opacity:0;transition:opacity .75s ease .05s}
#ldCanvas{position:absolute;inset:0;width:100%;height:100%}
.ld-rays{position:absolute;left:50%;top:52%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.05) 0deg 5deg,transparent 5deg 15deg);
  animation:spin 40s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%)}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-top,.ld-bottom{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;width:min(560px,100%);transition:transform .75s ease}
#loader.out .ld-top{transform:translateY(-30px) scale(1.06)}
#loader.out .ld-bottom{transform:translateY(30px)}
.ld-crest{width:118px;height:118px;border-radius:50%;overflow:hidden;background:var(--tc);border:5px solid #fff;margin:10px 0 4px;
  animation:crestIn .8s cubic-bezier(.2,1.6,.4,1) .12s backwards,crestPulse 1.5s ease-out 1s infinite}
.ld-crest img{width:100%;height:100%;display:block}
@keyframes crestIn{from{transform:scale(0) rotate(-20deg);opacity:0}}
@keyframes crestPulse{0%{box-shadow:0 0 0 0 var(--tcg)}100%{box-shadow:0 0 0 22px rgba(0,0,0,0)}}
#loader.done .ld-crest{animation:crestFlash .6s ease-out forwards}
@keyframes crestFlash{40%{filter:brightness(1.8) drop-shadow(0 0 30px #fff);transform:scale(1.15)}100%{filter:brightness(1.1);transform:scale(1.05)}}
.ld-title{margin:6px 0 0;font:clamp(32px,7vw,56px)/1.05 var(--fd);letter-spacing:.03em;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35);text-wrap:balance}
.ld-title .w{display:inline-block;white-space:nowrap}
.ld-title i{font-style:normal;display:inline-block;animation:letterUp .6s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:calc(var(--i)*40ms + .3s)}
@keyframes letterUp{from{transform:translateY(34px) scale(.5);opacity:0}}
#loader.done .ld-title{animation:titleGlow .7s ease-out}
@keyframes titleGlow{40%{text-shadow:0 0 24px rgba(255,255,255,.9),0 4px 0 rgba(0,0,0,.35)}}
.ld-sub{margin:0;color:#c9d3f5;font-size:15px;animation:fadeUp .6s ease-out .8s backwards}
.ld-bar{width:min(420px,100%);height:18px;background:rgba(255,255,255,.09);padding:4px}
.ld-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--tc),#ffd54a);transition:width .4s cubic-bezier(.3,.9,.3,1);position:relative;overflow:hidden}
.ld-bar i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.28) 0 8px,transparent 8px 16px);background-size:34px 100%;animation:stripes .5s linear infinite}
@keyframes stripes{to{background-position:34px 0}}
.ld-stage{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.22em;color:var(--gold);font-weight:700;min-height:1.4em}
.ld-tip{margin:0;color:var(--muted);font-size:13.5px;max-width:52ch;text-wrap:balance;min-height:2.6em}
.tagline{color:#c8d3f5;font-size:16px;margin:0;max-width:44ch;text-wrap:balance}
.menu-buttons{display:grid;gap:10px;width:min(320px,100%)}
.menu-buttons .btn{width:100%}
.menu-foot{color:var(--dim);font-size:12px;margin:0}
.tribe-strip{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tribe-strip span{width:14px;height:14px;transform:rotate(45deg);border:2px solid rgba(0,0,0,.4)}

/* ---------- setup ---------- */
#setup{background:rgba(5,8,18,.72);overflow:auto;align-items:flex-start}
.setup-card{width:min(1080px,100%);margin:auto;padding:22px;display:flex;flex-direction:column;gap:18px}
.setup-card header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.setup-card h2{font:30px/1 var(--fd);margin:0;letter-spacing:.02em}
.tribe-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tcard{position:relative;text-align:left;border:0;cursor:pointer;padding:0;background:var(--plate);display:flex;flex-direction:column;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);transition:transform .12s}
.tcard:hover{transform:translateY(-2px)}
.tcard:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.tcard .band{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--tc);color:var(--tt)}
.tcard .band img{width:52px;height:52px;margin:-6px 0;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.tcard .band b{font:22px/1 var(--fd);letter-spacing:.02em}
.tcard .band small{display:block;font-size:12px;opacity:.85;font-weight:500}
.tcard .body{padding:10px 12px 12px;display:grid;gap:6px;color:#d7defa;font-size:13px}
.tcard .body .ab{color:var(--gold);font-weight:700}
.tcard .meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.07);font-size:12px;color:#cdd6f6}
.tcard.sel{box-shadow:inset 0 0 0 3px var(--gold)}
.tcard.sel::after{content:"✓";position:absolute;right:12px;top:10px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--gold);color:#2a1a00;font-weight:800}
.setup-opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.opt{display:grid;gap:6px}
.opt>label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1;border:0;cursor:pointer;padding:9px 8px;background:var(--plate2);color:#cdd6f6;font-weight:600;font-size:13px;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.seg button.on{background:linear-gradient(180deg,#ffd95c,#ffab00);color:#2a1a00}
.seg button:focus-visible{outline:2px solid var(--gold)}
.setup-go{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;align-items:center}
.setup-go p{margin:0;color:var(--muted);flex:1;min-width:220px}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:4}
#hud>*{pointer-events:auto}
#topbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;
  background:linear-gradient(180deg,rgba(7,11,23,.92),rgba(7,11,23,.55) 70%,rgba(7,11,23,0));pointer-events:none}
#topbar>*{pointer-events:auto}
.tb-tribe{display:flex;align-items:center;gap:10px;min-width:0}
.crest{width:34px;height:34px;display:grid;place-items:center;transform:rotate(45deg);border:3px solid rgba(0,0,0,.45);flex:none}
.crest img{width:40px;height:40px;transform:rotate(-45deg)}
.tb-tribe b{font:20px/1 var(--fd);letter-spacing:.02em;display:block}
.tb-tribe small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26ch}
.tb-res{display:flex;gap:8px;margin:0 auto;flex-wrap:wrap;justify-content:center}
.res{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border:0;cursor:pointer;background:rgba(19,27,53,.92);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);font-variant-numeric:tabular-nums}
.res b{font-size:18px;font-weight:700;min-width:2ch;text-align:right}
.res em{font-style:normal;font-size:12px;font-weight:700;color:var(--good)}
.res em.neg{color:var(--bad)}
.res:focus-visible{outline:2px solid var(--gold)}
.tb-meta{display:flex;gap:14px;align-items:center}
.tb-meta div{text-align:right}
.tb-meta small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.tb-meta b{font:20px/1 var(--fd);font-variant-numeric:tabular-nums}
.ico{display:inline-block;width:18px;height:18px;flex:none;vertical-align:-4px}
#minimap{position:absolute;right:16px;top:calc(62px + env(safe-area-inset-top,0px));width:188px;height:112px;background:rgba(7,11,23,.7);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);cursor:pointer}
#banner{position:absolute;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:10px 18px;display:flex;gap:10px;align-items:center;
  font-weight:600;white-space:nowrap;z-index:6}
#banner i{width:14px;height:14px;transform:rotate(45deg);display:inline-block;border:2px solid rgba(0,0,0,.4)}
#toasts{position:absolute;left:50%;top:calc(110px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:7;width:min(460px,calc(100% - 32px))}
.toast{padding:9px 16px;font-weight:600;text-align:center;animation:tin .25s ease-out;border-left:4px solid var(--tc,#ffcf3f)}
.toast.out{animation:tout .4s ease-in forwards}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
#dock{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;
  padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(7,11,23,.9),rgba(7,11,23,0));pointer-events:none}
#dock>*{pointer-events:auto}
.dock-left{display:flex;gap:6px;flex-wrap:wrap}
.dock-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;cursor:pointer;padding:8px 10px 7px;min-width:62px;
  background:linear-gradient(180deg,#2c3a72,#1a2450);color:#e7ecff;font-size:11px;font-weight:700;letter-spacing:.01em;border-radius:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 5px 0 #121a38,0 9px 14px rgba(0,0,0,.42);
  transition:transform .14s cubic-bezier(.3,1.5,.5,1),box-shadow .14s ease,background .14s ease}
.dock-btn i{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--bc,#3d51a0);box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.25)}
.dock-btn svg{width:20px;height:20px}
.dock-btn:hover{transform:translateY(-3px);background:linear-gradient(180deg,#38499166,#1a2450),linear-gradient(180deg,#3a4c95,#212c62)}
.dock-btn:hover i{transform:scale(1.08) rotate(-4deg);transition:transform .16s cubic-bezier(.3,1.6,.5,1)}
.dock-btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 0 #121a38,0 3px 6px rgba(0,0,0,.4)}
.dock-btn.on{background:linear-gradient(180deg,#ffd95c,#ffab00);color:#2a1a00;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 5px 0 #8a5a00,0 9px 14px rgba(255,171,0,.28)}
.dock-btn.on i{background:rgba(255,255,255,.42)}
.dock-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.dock-btn .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--good);color:#04240f;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.5);animation:dotPop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes dotPop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.dock-left{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.dock-right{display:flex;gap:8px;align-items:center}
.pill{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--gold);color:#2a1a00;font-weight:800;font-size:12px}
.pill.zero{background:rgba(255,255,255,.15);color:var(--muted)}
#bEnd{min-width:150px}
#bEnd.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.25)}}

/* ---------- selection panel ---------- */
#panel{position:absolute;left:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(372px,calc(100% - 32px));max-height:calc(100% - 190px);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;z-index:5}
#panel::-webkit-scrollbar,.ov-card::-webkit-scrollbar{width:8px}
#panel::-webkit-scrollbar-thumb,.ov-card::-webkit-scrollbar-thumb{background:#2c3b6b;border-radius:4px}
.p-head{display:flex;gap:10px;align-items:center}
.p-head img{width:64px;height:64px;flex:none;margin:-6px -4px -6px -6px}
.p-head .t{min-width:0;flex:1}
.p-head h3{font:22px/1.05 var(--fd);margin:0;letter-spacing:.02em}
.p-head .sub{color:var(--muted);font-size:12.5px}
.owner{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 8px 2px 6px;border-radius:999px;background:rgba(255,255,255,.08)}
.owner i{width:10px;height:10px;transform:rotate(45deg);display:inline-block;border:1.5px solid rgba(0,0,0,.45)}
.p-close{margin-left:auto;align-self:flex-start;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px;line-height:1}
.hp{display:grid;gap:4px}
.hp .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.hp .lab b{color:var(--text);font-size:14px}
.bar{height:10px;background:#0a0f20;border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:rgba(255,255,255,.05);padding:6px 4px;text-align:center;border-radius:6px}
.stat small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stat b{font:20px/1.1 var(--fd);font-variant-numeric:tabular-nums}
.stat em{display:block;font-style:normal;font-size:10.5px;color:var(--good);min-height:14px}
.vs{display:grid;gap:5px;font-size:12.5px}
.vs .row{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.vs .k{width:76px;flex:none;font-weight:700;padding-top:2px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 3px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.07)}
.chip img{width:18px;height:18px}
.chip.good{background:rgba(79,220,138,.16);color:#a9f5c9}
.chip.bad{background:rgba(255,93,108,.16);color:#ffc0c6}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.acts .btn{padding:9px 10px;font-size:13px;flex-direction:column;gap:1px;line-height:1.15}
.acts .btn.wide{grid-column:1/-1}
.note{font-size:12.5px;color:var(--muted);margin:0}
.note.warn{color:var(--warn)}
.status{font-size:12.5px;padding:6px 10px;border-radius:6px;background:rgba(255,207,63,.12);color:#ffe7a0;font-weight:600}
.status.done{background:rgba(255,255,255,.06);color:var(--muted)}
.cost{display:inline-flex;gap:8px;align-items:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px}
.cost span{display:inline-flex;align-items:center;gap:3px}
.cost .lack{color:var(--bad)}
.cost .ico{width:15px;height:15px;vertical-align:-3px}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:4px 0 -2px}
.train{display:grid;gap:6px}
.tu{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:6px 8px 6px 4px;border:0;cursor:pointer;text-align:left;background:rgba(255,255,255,.05);border-radius:8px;color:var(--text)}
.tu:hover{background:rgba(255,255,255,.1)}
.tu:focus-visible{outline:2px solid var(--gold)}
.tu img{width:48px;height:48px;margin:-4px}
.tu b{display:block;font-size:14px}
.tu small{display:block;color:var(--muted);font-size:11.5px}
.tu .why{color:var(--warn);font-size:11px}
.tu.off{opacity:.55;cursor:not-allowed}
.tu .st{font-size:11px;color:#c9d2f2;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.opts{display:grid;gap:6px}
.opt-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border:0;cursor:pointer;text-align:left;background:rgba(255,255,255,.05);border-radius:8px;color:var(--text)}
.opt-row:hover{background:rgba(255,255,255,.1)}
.opt-row b{display:block;font-size:13.5px}
.opt-row small{display:block;color:var(--muted);font-size:11.5px}
.opt-row .why{color:var(--warn)}
.opt-row.off{opacity:.55;cursor:not-allowed}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}

/* ---------- tooltip ---------- */
#tip{position:absolute;z-index:8;pointer-events:none;padding:10px 12px;min-width:200px;max-width:280px;font-size:12.5px}
#tip h4{margin:0 0 6px;font:15px/1.1 var(--fd);letter-spacing:.02em}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;text-align:center}
.duel .side b{display:block;font-size:22px;font-family:var(--fd)}
.duel .side small{color:var(--muted);font-size:11px}
.duel .vsx{font:14px var(--fd);color:var(--muted)}
.tag-strong{color:#8ff0b8;font-weight:700}
.tag-weak{color:#ff9aa4;font-weight:700}

/* ---------- overlays / modal ---------- */
#overlay,#modal{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(3,6,14,.72)}
#modal{z-index:30}
.ov-card{position:relative;width:min(1120px,100%);max-height:100%;overflow:auto;padding:22px 22px 26px}
.ov-close{position:absolute;right:12px;top:10px;border:0;background:rgba(255,255,255,.08);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;z-index:2}
.ov-close:focus-visible{outline:2px solid var(--gold)}
.ov-card h2{font:30px/1 var(--fd);margin:0 0 4px;letter-spacing:.02em}
.ov-card .lead{color:var(--muted);margin:0 0 16px;max-width:70ch}
.modal-card{width:min(560px,100%);padding:22px;display:grid;gap:14px;max-height:100%;overflow:auto}
.modal-card h2{font:28px/1.05 var(--fd);margin:0;letter-spacing:.02em;text-wrap:balance}
.modal-card p{margin:0;color:#cdd6f6}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.reward-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reward{border:0;cursor:pointer;text-align:left;padding:14px;background:var(--plate2);color:var(--text);display:grid;gap:6px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.reward:hover{background:var(--plate3)}
.reward:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.reward b{font:20px/1 var(--fd)}
.reward span{color:#cdd6f6;font-size:13px}

/* tech tree */
.tt-side{display:grid;gap:10px;padding:14px;background:rgba(255,255,255,.04);border-radius:10px;position:sticky;top:0}
.tt-side h3{font:24px/1 var(--fd);margin:0}
.ticon{width:60px;height:60px;display:grid;place-items:center;flex:none}
.ticon img,.ticon svg{width:60px!important;height:60px!important}
.tt-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tt-legend i{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.lg.done{background:linear-gradient(135deg,#f5a524,#3ecf8e 50%,#b69cff)}
.lg.afford{background:#223060;box-shadow:inset 0 0 0 2px var(--gold)}
.lg.avail{background:#223060;box-shadow:inset 0 0 0 2px #8ea2d8}
.lg.locked{background:#151c36;box-shadow:inset 0 0 0 1px #2b3b6c}
.ticon.sq{border-radius:14px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 3px var(--bc),inset 0 -5px 0 rgba(0,0,0,.25)}
.ticon.sq img,.ticon.sq svg{width:44px!important;height:44px!important}

/* ---------- tech tree v2: square tiles on a zoomable board ---------- */
.tt2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.tt2-stage{position:relative;height:min(66vh,700px);min-height:340px;overflow:hidden;border-radius:14px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse 60% 55% at 50% 50%,rgba(60,86,170,.28),rgba(0,0,0,0) 70%),#0a1022;box-shadow:inset 0 0 0 1px #22305a,inset 0 0 60px rgba(0,0,0,.55)}
.tt2-stage.panning{cursor:grabbing}
.tt2-stage img,.tt2-stage svg{-webkit-user-drag:none;user-select:none}
.tile img,.tile svg{pointer-events:none}
.tt2-shake{position:absolute;inset:0}
.tt2-shake.shake{animation:ttShake .42s cubic-bezier(.3,.7,.4,1)}
@keyframes ttShake{0%{transform:translate(0,0)}15%{transform:translate(-5px,3px)}30%{transform:translate(5px,-3px)}45%{transform:translate(-3px,-2px)}60%{transform:translate(3px,2px)}80%{transform:translate(-1px,1px)}100%{transform:translate(0,0)}}
.tt2-world{position:absolute;left:0;top:0;width:1400px;height:1400px;transform-origin:0 0;will-change:transform}
.tt2-world::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(140,170,255,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(140,170,255,.07) 2px,transparent 2px);background-size:56px 56px;background-position:-2px -2px;
  -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 30%,transparent 68%);mask-image:radial-gradient(circle at 50% 50%,#000 30%,transparent 68%)}
.tt2-world>svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.ln{fill:none;stroke-linecap:square}
.ln-base{stroke:rgba(0,0,0,.45);stroke-width:14}
.ln-state{stroke:#27355f;stroke-width:6}
.ln-state.avail{stroke:var(--bc);stroke-opacity:.6;stroke-dasharray:12 10;animation:lnFlow 1.2s linear infinite}
.ln-state.done{stroke:var(--bc);stroke-width:8}
@keyframes lnFlow{to{stroke-dashoffset:-22}}
.ln-charge{stroke:#fff;stroke-width:10;opacity:0;filter:drop-shadow(0 0 8px var(--bc))}
.ln-charge.go{animation:lnCharge .5s cubic-bezier(.5,0,.4,1) forwards}
@keyframes lnCharge{0%{stroke-dashoffset:var(--len);opacity:1}62%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.tt2-halo{position:absolute;left:700px;top:700px;width:290px;height:290px;margin:-145px 0 0 -145px;border:3px dashed rgba(170,190,255,.16);border-radius:22px;animation:haloSpin 60s linear infinite;pointer-events:none}
.tt2-halo::after{content:"";position:absolute;inset:34px;border:2px solid rgba(170,190,255,.1);border-radius:16px;animation:haloSpin 40s linear infinite reverse}
@keyframes haloSpin{to{transform:rotate(360deg)}}
.tt2-core{position:absolute;left:700px;top:700px;width:156px;height:156px;margin:-78px 0 0 -78px;display:grid;place-items:center;transform:rotate(45deg);border-radius:22px;
  background:var(--tc);box-shadow:0 0 0 6px #0b1020,0 0 0 10px rgba(255,255,255,.14),inset 0 -10px 0 rgba(0,0,0,.25),0 20px 40px rgba(0,0,0,.5);pointer-events:none}
.tt2-core img{transform:rotate(-45deg);width:128px;height:128px}
.tile{position:absolute;width:118px;height:118px;margin:-59px 0 0 -59px;padding:0;border:0;background:none;cursor:pointer;color:var(--text);font:inherit;-webkit-tap-highlight-color:transparent}
.tile:focus-visible{outline:none}
.tile:focus-visible .tile-face{box-shadow:0 0 0 4px #fff,0 10px 18px rgba(0,0,0,.45)}
.tile-body{position:absolute;inset:0;display:block;will-change:transform}
.tile.held{z-index:5;cursor:grabbing}
.tile-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:16px;padding:14px 6px 8px;text-align:center;
  transition:transform .18s cubic-bezier(.3,1.4,.5,1),box-shadow .18s ease,filter .18s ease}
.tile:hover .tile-face{transform:translateY(-4px)}
.tile.held .tile-face{transform:translateY(-6px);filter:brightness(1.12)}
.tile .ico{display:grid;place-items:center;width:44px;height:44px}
.tile .ico img,.tile .ico svg{width:44px!important;height:44px!important}
.tile .nm{font:14px/1.02 var(--fd);letter-spacing:.02em}
.tile .pr{font-size:10.5px;font-weight:700;opacity:.92;font-variant-numeric:tabular-nums}
.tile .tier{position:absolute;left:9px;top:6px;font:12px/1 var(--fd);opacity:.7}
.tile .badge{position:absolute;right:6px;top:6px;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;font-size:13px;font-weight:800}
/* locked */
.tile.locked .tile-face{background:linear-gradient(180deg,#19213f,#131a33);color:#6f7aa3;box-shadow:inset 0 0 0 2px #243259,inset 0 -6px 0 rgba(0,0,0,.3),0 8px 14px rgba(0,0,0,.35)}
.tile.locked .ico{opacity:.4;filter:grayscale(.7)}
.tile.locked .badge{background:#0b1020;color:#6f7aa3}
/* available */
.tile.avail .tile-face{background:linear-gradient(180deg,#2b3d7c,#1d2a5a);box-shadow:inset 0 0 0 3px var(--bc),inset 0 -7px 0 rgba(0,0,0,.3),0 10px 18px rgba(0,0,0,.45)}
.tile.avail.afford .tile-face{box-shadow:inset 0 0 0 3px var(--gold),inset 0 -7px 0 rgba(0,0,0,.3),0 0 0 0 rgba(255,207,63,.5),0 10px 18px rgba(0,0,0,.45);animation:affordPulse 1.8s ease-in-out infinite}
.tile.avail.afford:hover .tile-face{animation-play-state:paused}
@keyframes affordPulse{50%{box-shadow:inset 0 0 0 3px var(--gold),inset 0 -7px 0 rgba(0,0,0,.3),0 0 0 7px rgba(255,207,63,.18),0 10px 18px rgba(0,0,0,.45)}}
.tile.avail .pr{color:#ffe28a}
/* researched */
.tile.done .tile-face{background:linear-gradient(180deg,color-mix(in srgb,var(--bc) 82%,#fff),var(--bc));color:#10162b;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),inset 0 -8px 0 rgba(0,0,0,.2),0 10px 18px rgba(0,0,0,.45)}
.tile.done .badge{background:#10162b;color:#fff}
.tile.done .tier{opacity:.55}
/* selected */
.tile.cur .tile-face{box-shadow:inset 0 0 0 3px #fff,inset 0 -7px 0 rgba(0,0,0,.28),0 0 0 5px rgba(255,255,255,.25),0 12px 22px rgba(0,0,0,.5)}
.tile.cur::after{content:"";position:absolute;inset:-12px;border:3px solid #fff;border-radius:22px;opacity:.85;pointer-events:none;animation:curBob 1.4s ease-in-out infinite}
@keyframes curBob{50%{inset:-7px;opacity:.45}}
.tile.held::after{display:none}
/* unlock + wake animations */
.tile.unlocking{z-index:6}
.tile.unlocking .tile-face{animation:tileUnlock .95s cubic-bezier(.3,.9,.3,1)}
.tile.unlocking .tile-face::after{content:"";position:absolute;inset:0;border-radius:16px;background:#fff;animation:tileFlash .95s ease-out forwards;pointer-events:none}
@keyframes tileUnlock{0%{transform:scale(1)}18%{transform:scale(.78) rotate(-10deg)}42%{transform:scale(1.34) rotate(7deg)}64%{transform:scale(.94) rotate(-3deg)}82%{transform:scale(1.05) rotate(1deg)}100%{transform:scale(1) rotate(0)}}
@keyframes tileFlash{0%,20%{opacity:0}32%{opacity:.95}100%{opacity:0}}
.tile.wake .tile-face{animation:tileWake .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes tileWake{0%{transform:scale(1)}35%{transform:scale(1.16) translateY(-6px)}100%{transform:scale(1)}}
/* stage chrome */
.tt2-banner{position:absolute;left:50%;top:14px;z-index:8;transform:translate(-50%,-24px);opacity:0;pointer-events:none;min-width:min(360px,86%);max-width:92%;
  padding:10px 18px 10px 16px;background:rgba(10,16,36,.92);border-left:6px solid var(--bc,#ffcf3f);border-radius:10px;font:20px/1.1 var(--fd);letter-spacing:.02em;text-align:left;
  box-shadow:0 14px 30px rgba(0,0,0,.5)}
.tt2-banner small{display:block;font:500 12.5px/1.35 var(--fb);color:#cdd6f6;letter-spacing:0;margin-top:3px}
.tt2-banner.show{animation:bannerIn 2.6s cubic-bezier(.2,1.2,.3,1) forwards}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-24px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1.04)}18%{transform:translate(-50%,0) scale(1)}86%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-12px)}}
.tt2-hint{position:absolute;left:12px;bottom:12px;z-index:3;font-size:11.5px;color:var(--muted);pointer-events:none;background:rgba(7,11,23,.6);padding:4px 8px;border-radius:6px}
.tt2-tools{position:absolute;right:10px;bottom:10px;z-index:3;display:flex;gap:4px;padding:4px;background:rgba(7,11,23,.75);border-radius:10px;box-shadow:inset 0 0 0 1px #2b3b6c}
.tt2-tools button{width:36px;height:36px;border:0;border-radius:7px;background:#1f2c58;color:var(--text);font:20px/1 var(--fd);cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.tt2-tools button:hover{background:#2a3b73}
.tt2-tools button:active{transform:translateY(1px);box-shadow:none}
.tt2-tools button:focus-visible{outline:2px solid var(--gold)}
.tt2-tools .zl{width:58px;font:600 13px/1 var(--fb);font-variant-numeric:tabular-nums}
/* armory purchase */
.card.bought{animation:cardBought .9s cubic-bezier(.3,1.3,.4,1)}
@keyframes cardBought{0%{transform:scale(1);background:var(--plate2)}20%{transform:scale(1.045);background:#5a4a14}100%{transform:scale(1);background:var(--plate2)}}
.lvls i.new{animation:pipIn .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pipIn{0%{transform:scaleX(0);background:#fff}60%{transform:scaleX(1.3);background:#fff}100%{transform:scaleX(1)}}
#fxLayer{position:fixed;inset:0;width:100%;height:100%;z-index:45;pointer-events:none}

/* armory / market / stats / codex */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{padding:14px;background:var(--plate2);display:grid;gap:8px;align-content:start;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.card h3{font:21px/1 var(--fd);margin:0;letter-spacing:.02em}
.card p{margin:0;color:#cdd6f6;font-size:13px}
.lvls{display:flex;gap:5px}
.lvls i{width:22px;height:8px;border-radius:4px;background:rgba(255,255,255,.14)}
.lvls i.on{background:var(--gold)}
table.grid{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.grid th,table.grid td{padding:7px 8px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07);white-space:nowrap}
table.grid th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;position:sticky;top:0;background:#162042}
.scroll-x{overflow-x:auto;max-width:100%}
.mx td,.mx th{text-align:center!important;padding:6px!important}
.mx td.s{background:rgba(79,220,138,.22);color:#b7f7d2;font-weight:800}
.mx td.w{background:rgba(255,93,108,.24);color:#ffc2c8;font-weight:800}
.mx td.n{color:#56608a}
.mx th img{width:30px;height:30px;display:block;margin:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.help h3{font:20px/1.1 var(--fd);margin:16px 0 6px;letter-spacing:.02em}
.help p,.help li{color:#cfd7f5;max-width:72ch}
.help ul{padding-left:18px;margin:6px 0}
.kbd{display:inline-block;padding:1px 7px;border-radius:5px;background:#26335f;font-size:12px;font-weight:700;border-bottom:2px solid #121a33}
.mk-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:12px;background:var(--plate2);border-radius:8px}
.mk-row b{font-size:16px}
.log-list{display:grid;gap:4px;font-size:13px}
.log-list div{padding:6px 10px;background:rgba(255,255,255,.04);border-left:3px solid var(--lc,#445);border-radius:4px}
.log-list small{color:var(--muted);margin-right:6px}
.cmp{display:flex;align-items:center;gap:6px}
.cmp i{width:10px;height:10px;transform:rotate(45deg);display:inline-block;border:1.5px solid rgba(0,0,0,.45)}
.bars{display:grid;gap:4px}
.brow{display:grid;grid-template-columns:120px 1fr 56px;gap:8px;align-items:center;font-size:12.5px}
.brow .b{height:12px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden}
.brow .b i{display:block;height:100%}

.chief{width:40px;height:40px;border-radius:50%;border:3px solid #fff;overflow:hidden;flex:none;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.chief img{width:100%;height:100%;display:block}
#setup.pick{display:block;padding:0;overflow-y:auto;overflow-x:hidden;background:#0a0f20}
#pickSky{position:fixed;inset:0;width:100%;height:100%;display:block}
.pick-wrap{position:relative;z-index:1;width:min(1080px,100%);margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.pick-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-right:130px}
.pick-head .btn{justify-self:start;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.pick-title{margin:0;font:clamp(24px,4.4vw,42px)/1 var(--fd);letter-spacing:.05em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3);display:flex;align-items:center;gap:14px;white-space:nowrap}

function placeVillagesAndRuins(caps) {

  const C = COUNTERS[aType] || {};
  let m = C[dType] || 1;
  if (C.city && dInCity) m = Math.max(m, C.city);
  return m;
}

/* ---------- combat forecast (deterministic, shown to the player) ---------- */
function combatPreview(a, d, fromX, fromY) {
  if (fromX === undefined) { fromX = a.x; fromY = a.y; }
  const sa = unitStats(a, fromX, fromY), sd = unitStats(d);
  const dInCity = tile(d.x, d.y).city >= 0;
  const boats = sa.boat || sd.boat;
  const mA = boats ? 1 : counterMult(a.type, d.type, dInCity);
  const mD = boats ? 1 : counterMult(d.type, a.type, false);
  const db = defenseBonus(d, d.x, d.y);
  const atkE = sa.atk * mA, defE = sd.def * mD;
  const aF = atkE * (a.hp / sa.maxHp);

  const dist = cheb(fromX, fromY, d.x, d.y);
  const ko = dmg >= d.hp, saved = ko && hasNineLives(d), kills = ko && !saved;
  if (!ko && tot > 0 && defE > 0 && dist <= sd.rng) ret = Math.round(dF / tot * defE * 4.5);

}

/* ---------- movement ---------- */
function passable(ti, t) {
  if (!t) return false;

  if (t.t === 'ocean') return hasTech(ti, 'navigation');
  return true;
}
function roadTile(ti, t) { return (t.road || t.city >= 0) && (t.owner === -1 || t.owner === ti); }
function adjEnemy(ti, x, y) {
  for (const [nx, ny] of neighbors(x, y)) { const o = unitAt(nx, ny); if (o && o.owner !== ti) return true; }
  return false;
}
/* Dijkstra over movement points. Forest/mountain, embarking and enemy
   zones of control stop movement; roads halve the cost. */
function reachable(u, ignoreZoc) {
  const st = unitStats(u), M = st.mov, ti = u.owner;
  const start = idx(u.x, u.y);
  const best = new Map();
  best.set(start, { c: 0, prev: -1, stop: false });
  const open = [[0, start]];
  const verdant = tribeKey(ti) === 'verdant';
  while (open.length) {
    let bi = 0; for (let i = 1; i < open.length; i++) if (open[i][0] < open[bi][0]) bi = i;
    const [c, ci] = open.splice(bi, 1)[0];
    const cur = best.get(ci);
    if (c > cur.c + 1e-9) continue;
    if (cur.stop) continue;
    const x = tx(ci), y = ty(ci), t0 = G.tiles[ci];
    for (const [nx, ny] of neighbors(x, y)) {
      const ni = idx(nx, ny), t = G.tiles[ni];
      if (!passable(ti, t)) continue;
      const o = unitAt(nx, ny);
      if (o && o.owner !== ti) continue;
      const road = roadTile(ti, t0) && roadTile(ti, t) && (t0.road || t.road);
      const step = road ? 0.5 : 1;
      const nc = c + step;
      if (nc > M + 1e-9) continue;
      let stop = false;
      if (isLand(t0) !== isLand(t)) stop = true;
      if (!road && (t.t === 'mountain' || (t.t === 'forest' && !verdant))) stop = true;
      if (!ignoreZoc && adjEnemy(ti, nx, ny)) stop = true;
      const prev = best.get(ni);
      if (!prev || nc < prev.c - 1e-9 || (Math.abs(nc - prev.c) < 1e-9 && prev.stop && !stop)) {
        best.set(ni, { c: nc, prev: ci, stop });
        open.push([nc, ni]);
      }
    }
  }
  return best;
}
function moveTargets(u) {
  if (!canMoveNow(u)) return new Map();
  const r = reachable(u);
  const out = new Map();
  for (const [i, v] of r) { if (i === idx(u.x, u.y)) continue; if (OCC[i]) continue; out.set(i, v); }
  return out;
}
function pathTo(reach, i) {
  const p = []; let cur = i;
  while (cur !== -1 && cur !== undefined) { p.push(cur); const n = reach.get(cur); cur = n ? n.prev : -1; }
  return p.reverse();
}

/* ---------- action availability ---------- */
function canMoveNow(u) { if (u.done) return false; if (u.canEscape) return true; return !u.moved && !u.attacked; }
function canAttackNow(u) {
  if (u.done || u.attacked) return false;
  if (u.moved && !UNITS[u.type].dash) return false;
  return unitStats(u).atk > 0;
}
function visibleTo(ti, x, y) { return !!G.tribes[ti].explored[idx(x, y)]; }
function attackTargets(u, fx, fy) {
  if (fx === undefined) { fx = u.x; fy = u.y; }
  const st = unitStats(u, fx, fy);
  if (st.atk <= 0) return [];
  const out = [];
  for (const e of G.units) {
    if (e.owner === u.owner) continue;
    if (cheb(fx, fy, e.x, e.y) > st.rng) continue;
    if (!visibleTo(u.owner, e.x, e.y)) continue;
    out.push(e);
  }
  return out;
}
function canCapture(u) {
  const c = cityAt(u.x, u.y);
  return !!c && c.owner !== u.owner && !u.moved && !u.attacked && !u.done;
}
function canRecover(u) { return !u.moved && !u.attacked && !u.done && u.hp < maxHpOf(u); }
function healAmount(u) {
  const t = tile(u.x, u.y);
  let h = t.owner === u.owner ? 4 : 2;
  if (hasTech(u.owner, 'meditation')) h += 2;
  if (tribeKey(u.owner) === 'frostholm') h += 2;
  return h;
}
function paidHealCost(u) {
  const miss = maxHpOf(u) - u.hp;
  return Math.max(1, Math.ceil(miss / 2));
}
function canPaidHeal(u) {
  const t = tile(u.x, u.y);
  return t.owner === u.owner && u.hp < maxHpOf(u) && !u.paidHeal;
}
function rankCost(u) {
  if (u.rank >= 3) return null;
  if (u.xp >= XP_TO_PROMOTE) return {};
  const k = hasTech(u.owner, 'leadership') ? 0.5 : 1;
  return { gold: Math.ceil(RANK_COST[u.rank].gold * k) };
}
function canRankUp(u) {
  if (u.rank >= 3 || UNITS[u.type].cls === 'giant' && u.rank >= 3) return false;
  if (u.xp >= XP_TO_PROMOTE) return true;
  return tile(u.x, u.y).owner === u.owner;
}
function monkHealTargets(u) {
  return neighbors(u.x, u.y).map(([x, y]) => unitAt(x, y)).filter(o => o && o.owner === u.owner && o.hp < maxHpOf(o));
}
function monkConvertTargets(u) {
  return neighbors(u.x, u.y).map(([x, y]) => unitAt(x, y)).filter(o => o && o.owner !== u.owner && o.type !== 'champion' && visibleTo(u.owner, o.x, o.y));
}
function unitReady(u) {
  if (u.done) return false;
  if (!u.moved && !u.attacked) return true;
  if (u.canEscape) return true;
  if (canAttackNow(u) && attackTargets(u).length) return true;
  if (UNITS[u.type].healer && !u.attacked && (monkHealTargets(u).length || monkConvertTargets(u).length)) return true;
  return false;
}
function unitFresh(u) { return !u.done && !u.moved && !u.attacked; }
/* =====================================================================
   Part 3b: actions, economy (gold only), cities, research, upgrades, turns
   ===================================================================== */
function canAfford(ti, c) { const r = G.tribes[ti].res; return RES.every(k => (r[k] || 0) >= (c[k] || 0)); }
function pay(ti, c) { const r = G.tribes[ti].res; for (const k of RES) r[k] -= (c[k] || 0); if (typeof onResources === 'function') onResources(); }
function gain(ti, c) { const r = G.tribes[ti].res; for (const k of RES) r[k] += (c[k] || 0); if (typeof onResources === 'function') onResources(); }
function missingStr(ti, c) {
  const r = G.tribes[ti].res;
  return RES.filter(k => (c[k] || 0) > r[k]).map(k => `${(c[k] - r[k])} more ${k}`).join(', ');
}
function goldCost(n) { return { gold: Math.max(0, Math.round(n)) }; }

/* ---------- units ---------- */
function spawnUnit(type, ti, x, y, home, done) {
  const u = { id: G.nextUnitId++, type, owner: ti, x, y, hp: 1, rank: 0, xp: 0, kills: 0, home,
    moved: !!done, attacked: !!done, done: !!done, canEscape: false, paidHeal: false };
  G.units.push(u); UIDX.set(u.id, u); OCC[idx(x, y)] = u.id;
  u.hp = maxHpOf(u);
  return u;
}
function removeUnit(u) {
  G.units = G.units.filter(o => o !== u);
  UIDX.delete(u.id);
  if (OCC[idx(u.x, u.y)] === u.id) OCC[idx(u.x, u.y)] = 0;
}
function killUnit(v, byTi) {
  G.tribes[v.owner].losses++; removeUnit(v); FX('death', { u: v, by: byTi });
  /* Pumpkin Hollow "Trick or Treat": every defeated enemy drops gold */
  if (byTi >= 0 && byTi !== v.owner && tribeKey(byTi) === 'pumpkin') { gain(byTi, goldCost(3)); FX('bounty', { x: v.x, y: v.y, ti: byTi, gold: 3 }); }
}
function placeUnitAt(u, x, y) { OCC[idx(u.x, u.y)] = 0; u.x = x; u.y = y; OCC[idx(x, y)] = u.id; }
function unitCost(ti, type) {
  let g = (UNITS[type].cost || {}).gold || 0;
  const k = tribeKey(ti);
  return goldCost(Math.max(1, g));
}

function doMove(u, di) {
  if (!canMoveNow(u) || OCC[di]) return null;
  const reach = reachable(u);
  if (!reach.has(di) || di === idx(u.x, u.y)) return null;
  const path = pathTo(reach, di).map(i => [tx(i), ty(i)]);
  placeUnitAt(u, tx(di), ty(di));
  if (u.canEscape) { u.canEscape = false; u.done = true; } else u.moved = true;
  if (!UNITS[u.type].dash) u.done = true;
  reveal(u.owner, u.x, u.y, unitStats(u).vis);
  FX('move', { u, path });
  const t = tile(u.x, u.y);
  if (t.ruin) exploreRuin(u);
  return path;
}

function doAttack(u, d) {
  if (!canAttackNow(u) || !attackTargets(u).includes(d)) return null;
  const p = combatPreview(u, d);
  const res = { a: u, d, dmg: p.dmg, ret: 0, killed: false, died: false, ax: u.x, ay: u.y, dx: d.x, dy: d.y,
    ranged: p.dist > 1, aType: u.type, dType: d.type, aOwner: u.owner, dOwner: d.owner, mA: p.mA };
  u.attacked = true; u.moved = true;
  d.hp -= p.dmg;
  if (d.hp <= 0 && p.saved) { d.hp = 1; G.tribes[d.owner].nineRound = G.turn; res.saved = true; FX('ninelives', { u: d }); }
  else if (d.hp <= 0) {
    res.killed = true;
    killUnit(d, u.owner);
    u.xp++; u.kills++; G.tribes[u.owner].kills++;
    const T = UNITS[u.type];
    if (p.dist === 1 && T.rng === 1 && !p.sa.boat && passable(u.owner, tile(res.dx, res.dy)) && !OCC[idx(res.dx, res.dy)]) {
      placeUnitAt(u, res.dx, res.dy); res.advanced = true;
      reveal(u.owner, u.x, u.y, unitStats(u).vis);
    }
  } else if (p.ret > 0) {
    u.hp -= p.ret; res.ret = p.ret;
    if (u.hp <= 0) { res.died = true; killUnit(u, d.owner); d.xp++; d.kills++; G.tribes[d.owner].kills++; }
  }
  if (!res.died) {
    const T = UNITS[u.type];
    if (T.persist && res.killed) u.attacked = false;
    else if (T.escape && !p.sa.boat) u.canEscape = true;
    else u.done = true;
  }
  FX('attack', res);
  return res;
}

function doCapture(u) {
  if (!canCapture(u)) return false;
  const c = cityAt(u.x, u.y), prev = c.owner, ti = u.owner;
  c.owner = ti;
  if (prev === -1) {
    c.name = newCityName(ti);
    claimTerritory(c, 1);
    logMsg(`${G.tribes[ti].name} founded ${c.name}`, ti, 'capture');
  } else {
    for (const t of G.tiles) if (t.terr === c.id) t.owner = ti;
    for (const o of G.units) if (o.home === c.id) o.home = -1;
    if (c.capital) {
      c.capital = false;
      const rest = citiesOf(prev).sort((a, b) => b.level - a.level);
      if (rest.length) rest[0].capital = true;
    }
    logMsg(`${G.tribes[ti].name} captured ${c.name} from ${G.tribes[prev].name}!`, ti, 'capture');
  }
  u.done = true; u.moved = true; u.attacked = true;
  G.tribes[ti].captures++;
  if (tribeKey(ti) === 'liberty') { gain(ti, goldCost(6)); FX('bounty', { x: c.x, y: c.y, ti, gold: 6 }); }
  reveal(ti, c.x, c.y, c.radius + 1);
  FX('capture', { city: c, prev, ti });
  if (prev >= 0 && citiesOf(prev).length === 0) eliminate(prev, ti);
  checkVictory();
  return true;
}

function eliminate(ti, by) {
  const tr = G.tribes[ti];
  if (!tr.alive) return;
  tr.alive = false;
  for (const u of G.units.filter(o => o.owner === ti)) removeUnit(u);
  logMsg(`${tr.name} has been destroyed by ${G.tribes[by].name}!`, by, 'elim');
  FX('eliminated', { ti, by });
}
function checkVictory() {
  if (G.over) return;
  const alive = G.tribes.filter(t => t.alive);
  if (!G.allAI && !G.tribes[G.human].alive) { G.over = true; G.winner = alive.length ? bestScoreTribe() : -1; FX('gameover', {}); return; }
  if (alive.length === 1) { G.over = true; G.winner = alive[0].i; FX('gameover', {}); }
}
function bestScoreTribe() {
  let best = -1, bs = -1;
  for (const t of G.tribes) if (t.alive) { const s = scoreOf(t.i); if (s > bs) { bs = s; best = t.i; } }
  return best;
}

function doRecover(u) {
  if (!canRecover(u)) return false;
  const before = u.hp;
  u.hp = Math.min(maxHpOf(u), u.hp + healAmount(u));
  u.done = true; u.moved = true; u.attacked = true;
  FX('heal', { u, amount: u.hp - before });
  return true;
}
function doPaidHeal(u) {
  if (!canPaidHeal(u)) return false;
  const c = { gold: paidHealCost(u) };
  if (!canAfford(u.owner, c)) return false;
  pay(u.owner, c);
  const before = u.hp; u.hp = maxHpOf(u); u.paidHeal = true;
  FX('heal', { u, amount: u.hp - before });
  return true;
}
function doRankUp(u) {
  if (!canRankUp(u)) return false;
  const free = u.xp >= XP_TO_PROMOTE;
  if (!free) { const c = rankCost(u); if (!canAfford(u.owner, c)) return false; pay(u.owner, c); }
  u.rank++;
  if (free) { u.xp -= XP_TO_PROMOTE; u.hp = maxHpOf(u); } else u.hp = Math.min(maxHpOf(u), u.hp + RANK_BONUS.hp);
  FX('rankup', { u, free });
  return true;
}
function doMonkHeal(u) {
  const list = monkHealTargets(u);
  if (!UNITS[u.type].healer || u.done || u.attacked || !list.length) return false;
  const amt = 4 + (tribeKey(u.owner) === 'umbral' ? 2 : 0);
  for (const o of list) { const b = o.hp; o.hp = Math.min(maxHpOf(o), o.hp + amt); FX('heal', { u: o, amount: o.hp - b }); }
  u.attacked = true; u.moved = true; u.done = true;
  return true;
}
function doConvert(u, target) {
  if (!UNITS[u.type].converter || u.done || u.attacked || !monkConvertTargets(u).includes(target)) return false;
  const prev = target.owner;
  target.owner = u.owner; target.home = -1; target.moved = target.attacked = target.done = true;
  u.attacked = true; u.moved = true; u.done = true;
  G.tribes[prev].losses++;
  logMsg(`${G.tribes[u.owner].name} converted a ${UNITS[target.type].name} from ${G.tribes[prev].name}`, u.owner, 'convert');

  return true;
}
function doDisband(u) { removeUnit(u); FX('death', { u, by: -1 }); return true; }
function doSkip(u) { u.done = true; return true; }

/* ---------- ruins ---------- */
function exploreRuin(u) {
  const t = tile(u.x, u.y), ti = u.owner, tr = G.tribes[ti];
  t.ruin = false;
  const roll = rndInt(6);
  let text = '';
  if (roll === 0) { gain(ti, goldCost(10)); text = 'Ancient treasure: +10 gold'; }
  else if (roll === 1) { gain(ti, goldCost(12)); text = 'Forgotten vault: +12 gold'; }
  else if (roll === 2) {
    const avail = Object.keys(TECHS).filter(k => techState(ti, k) === 'available' && TECHS[k].tier <= 2);
    if (avail.length) { const k = pick(avail); tr.techs[k] = true; text = `Ancient scrolls: learned ${TECHS[k].name}`; onTechGained(ti, k); }
    else { gain(ti, goldCost(10)); text = 'Ancient treasure: +10 gold'; }
  } else if (roll === 3 && u.rank < 3) { u.rank++; u.hp = maxHpOf(u); text = `Training grounds: ${UNITS[u.type].name} ranked up`; }
  else if (roll === 4) { reveal(ti, u.x, u.y, 5); text = 'Watchtower: the land around is revealed'; }
  else {
    const spot = neighbors(u.x, u.y).find(([x, y]) => isLand(tile(x, y)) && !OCC[idx(x, y)] && passable(ti, tile(x, y)));
    if (spot) { spawnUnit('warrior', ti, spot[0], spot[1], -1, true); text = 'Lost tribe: a Warrior joins you'; }
    else { gain(ti, goldCost(8)); text = 'Ancient treasure: +8 gold'; }
  }
  logMsg(`${tr.name} explored ruins — ${text}`, ti, 'ruin');
  FX('ruin', { u, text, ti });
}

/* ---------- cities ---------- */
function cityCapacity(c) { return c.level + 1 + (hasTech(c.owner, 'leadership') ? 1 : 0); }
function cityUnitCount(c) { let n = 0; for (const u of G.units) if (u.home === c.id && u.owner === c.owner) n++; return n; }

function trainSpot(c) {
  if (!OCC[idx(c.x, c.y)]) return [c.x, c.y];
  const occ = unitAt(c.x, c.y);
  if (occ && occ.owner !== c.owner) return null;
  const spots = neighbors(c.x, c.y).filter(([x, y]) => { const t = tile(x, y); return isLand(t) && !OCC[idx(x, y)] && passable(c.owner, t); });
  spots.sort((a, b) => (tile(b[0], b[1]).owner === c.owner) - (tile(a[0], a[1]).owner === c.owner));
  return spots[0] || null;
}
function trainCheck(c, type) {
  const ti = c.owner, T = UNITS[type];
  if (T.tech && !hasTech(ti, T.tech)) return { ok: false, reason: `Research ${TECHS[T.tech].name}` };
  if (c.trainedTurn === G.turn) return { ok: false, reason: 'This city already trained a unit this turn' };
  if (cityUnitCount(c) >= cityCapacity(c)) return { ok: false, reason: 'Unit limit reached — grow the city' };
  if (!trainSpot(c)) return { ok: false, reason: 'No free tile in or next to the city' };
  const cost = unitCost(ti, type);
  if (!canAfford(ti, cost)) return { ok: false, reason: 'Need ' + missingStr(ti, cost) };
  return { ok: true };
}
function doTrain(c, type) {
  if (!trainCheck(c, type).ok) return null;
  pay(c.owner, unitCost(c.owner, type));
  const [x, y] = trainSpot(c);
  const u = spawnUnit(type, c.owner, x, y, c.id, true);
  c.trainedTurn = G.turn;
  FX('train', { u, city: c });
  return u;
}
function levelNeed(c) { return c.level + 1; }
function addPop(c, n) {
  if (!c || c.owner < 0) return;
  c.pop += n;
  while (c.pop >= levelNeed(c)) {
    c.pop -= levelNeed(c);
    c.level++;
    FX('levelup', { city: c });
    logMsg(`${c.name} grew to level ${c.level}`, c.owner, 'grow');
    const lv = Math.min(c.level, 5);
    if (G.tribes[c.owner].human) c.rewards.push(lv);
    else applyReward(c, aiPickReward(c, lv));
  }
}
function applyReward(c, id) {
  const ti = c.owner;
  if (id === 'workshop') c.workshop = true;
  else if (id === 'explorer') reveal(ti, c.x, c.y, 5);
  else if (id === 'walls') c.walls = true;
  else if (id === 'cache') gain(ti, goldCost(15));
  else if (id === 'boom') addPop(c, 3);
  else if (id === 'borders') { claimTerritory(c, 2); reveal(ti, c.x, c.y, 3); }
  else if (id === 'park') c.park++;
  else if (id === 'champion') {
    const spots = [[c.x, c.y]].concat(neighbors(c.x, c.y), neighbors(c.x, c.y, 2));
    const s = spots.find(([x, y]) => !OCC[idx(x, y)] && isLand(tile(x, y)) && passable(ti, tile(x, y)));
    if (s) spawnUnit('champion', ti, s[0], s[1], -1, true); else c.park++;
  }

}
function chooseReward(c, id) {
  if (!c.rewards.length) return;
  const lv = c.rewards.shift();
  if (!CITY_REWARDS[lv].some(r => r.id === id)) return;
  applyReward(c, id);
}
function wallsCheck(c) {
  if (c.walls) return { ok: false, reason: 'Already walled' };
  if (!hasTech(c.owner, 'construction')) return { ok: false, reason: 'Research Construction' };
  if (!canAfford(c.owner, ACTIONS_COST.walls)) return { ok: false, reason: 'Need ' + missingStr(c.owner, ACTIONS_COST.walls) };
  return { ok: true };
}
function doBuyWalls(c) { if (!wallsCheck(c).ok) return false; pay(c.owner, ACTIONS_COST.walls); c.walls = true; FX('build', { x: c.x, y: c.y }); return true; }

/* ---------- buildings: every building makes gold and grows its city ---------- */
function siteGold(ti, type, lvl, t) {
  const S = SITES[type], k = tribeKey(ti);
  let v = S.out[lvl - 1];

/* ---------- income ---------- */

/* ---------- turn flow ---------- */

/* ---------- score ---------- */

/* =====================================================================

/* ---------- attacks ---------- */

/* ---------- movement toward goals ---------- */
async function aiAdvance(u, ctx) {

/* ---------- input ---------- */
function setupInput() {

let PROFILE = null;
const PROFILE_LISTENERS = [];
function onProfile(fn) { PROFILE_LISTENERS.push(fn); }

function defaultProfile() {
  return { v: 1, wins: 3, earned: 0, games: 0, victories: 0, created: Date.now(),
    owned: { tribe: {}, skin: {}, perk: {}, pack: {} }, equipped: { skin: null, perks: [] },
    challenge: { week: '', days: {} }, nick: '' };
}
function loadProfile() {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null'); } catch (e) { p = null; }
  const d = defaultProfile();
  if (!p || typeof p !== 'object' || p.v !== 1) p = d;
  for (const k in d) if (p[k] === undefined || p[k] === null) p[k] = d[k];
  for (const k in d.owned) if (!p.owned[k] || typeof p.owned[k] !== 'object') p.owned[k] = {};
  if (!p.equipped || typeof p.equipped !== 'object') p.equipped = d.equipped;
  if (!Array.isArray(p.equipped.perks)) p.equipped.perks = [];
  if (!p.challenge || typeof p.challenge !== 'object') p.challenge = d.challenge;
  if (!p.challenge.days || typeof p.challenge.days !== 'object') p.challenge.days = {};
  p.wins = Math.max(0, Math.floor(+p.wins || 0));
  PROFILE = p;
  return p;
}
function saveProfile() {
  if (!PROFILE) return;
  try { localStorage.setItem(PROFILE_KEY, JSON.stringify(PROFILE)); } catch (e) { /* storage unavailable: keeps working for this visit */ }
  for (const fn of PROFILE_LISTENERS) { try { fn(PROFILE); } catch (e) { console.error(e); } }
  renderWinsChips();
}

/* ---------- ownership ---------- */
function owns(kind, key) {
  if (kind === 'tribe' && FREE_TRIBES.includes(key)) return true;
  return !!(PROFILE && PROFILE.owned[kind] && PROFILE.owned[kind][key]);
}
function ownsTribe(k) { return owns('tribe', k); }
function ownedTribes() { return TRIBE_ORDER.filter(ownsTribe); }
function grant(kind, key) {
  if (!PROFILE) loadProfile();
  if (!PROFILE.owned[kind]) PROFILE.owned[kind] = {};
  PROFILE.owned[kind][key] = Date.now();
  saveProfile();
}

/* ---------- Wins currency ---------- */
function winsBalance() { return PROFILE ? PROFILE.wins : 0; }
function addWins(n) { if (!PROFILE) loadProfile(); PROFILE.wins += n; if (n > 0) PROFILE.earned += n; saveProfile(); }
function spendWins(n) { if (!PROFILE || PROFILE.wins < n) return false; PROFILE.wins -= n; saveProfile(); return true; }
function winsLabel(n) { return n === 1 ? '1 Win' : n + ' Wins'; }
function renderWinsChips() {
  document.querySelectorAll('[data-wins]').forEach(el => { el.innerHTML = `${WIN_ICON}<b>${winsBalance().toLocaleString()}</b>`; el.setAttribute('aria-label', winsLabel(winsBalance()) + ' to spend'); });
}

/* ---------- equipment ---------- */
function equippedSkin() { const s = PROFILE && PROFILE.equipped.skin; return s && SKINS[s] && owns('skin', s) ? s : null; }
function equipSkin(key) { if (key && !owns('skin', key)) return false; PROFILE.equipped.skin = key || null; saveProfile(); return true; }
function equippedPerks() { return (PROFILE ? PROFILE.equipped.perks : []).filter(k => PERKS[k] && owns('perk', k)).slice(0, MAX_PERKS); }
function togglePerk(key) {
  if (!owns('perk', key)) return false;
  const list = equippedPerks();
  const i = list.indexOf(key);
  if (i >= 0) list.splice(i, 1);
  else { if (list.length >= MAX_PERKS) list.shift(); list.push(key); }
  PROFILE.equipped.perks = list; saveProfile(); return true;
}

/* ---------- end-of-match rewards ----------
   Called once when a match ends. Returns { wins, lines } for the game-over
   screen. Victories pay by difficulty; a daily challenge always pays 1. */
function onMatchEnd() {
  if (!G || G.allAI || G.rewarded) return null;
  if (!PROFILE) loadProfile();
  G.rewarded = true;
  const won = G.winner === G.human;
  PROFILE.games++;
  if (won) PROFILE.victories++;
  let wins = 0; const lines = [];
  if (G.challenge) {
    const score = scoreOf(G.human);
    let rec = null;
    if (typeof recordChallengeScore === 'function') { try { rec = recordChallengeScore(G.challenge, score, true); } catch (e) { console.error(e); } }
    wins += 1; lines.push('Daily challenge played: +1 Win');
    if (rec && rec.text) lines.push(rec.text);
    if (rec && rec.bonus) { wins += rec.bonus; }
  } else if (won) {
    const w = DIFFICULTY[G.difficulty].wins;
    wins += w; lines.push(`Victory on ${DIFFICULTY[G.difficulty].name}: +${winsLabel(w)}`);
  }
  if (wins) addWins(wins); else saveProfile();
  return { wins, lines };
}

/* =====================================================================
   Part 15: weekly challenge — one seeded run a day, scored for points,
   with a weekly leaderboard and a free look at the limited-time tribe.
   ===================================================================== */
const CHAL_TURNS = 25;
const DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const CHAL_SIZES = ['small', 'medium', 'medium', 'large'];
const CHAL_DIFF = ['normal', 'normal', 'hard', 'hard', 'crazy'];

/* ---------- dates ---------- */
function dayId(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function mondayOf(d) {
  const m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  m.setDate(m.getDate() - ((m.getDay() + 6) % 7));
  return m;
}
function weekId(d) { return 'week-' + dayId(mondayOf(d || new Date())); }
function weekDays(d) {
  const m = mondayOf(d || new Date()), out = [];
  for (let k = 0; k < 7; k++) { const q = new Date(m.getFullYear(), m.getMonth(), m.getDate() + k); out.push(dayId(q)); }
  return out;
}
function strSeed(s) { let h = 2166136261; for (let k = 0; k < s.length; k++) { h ^= s.charCodeAt(k); h = Math.imul(h, 16777619); } return (h >>> 0) % 2147483000; }
function chalRng(seed) { let a = seed % 2147483647 || 1; return () => { a = (a * 48271) % 2147483647; return (a - 1) / 2147483646; }; }

/* ---------- the run of the day ----------
   Everything about a day's run comes from its date, so every player gets
   the same map, the same rivals and the same tribe. */
function challengeOf(day) {
  const seed = strSeed('tessera:' + day), r = chalRng(seed);
  const pool = TRIBE_ORDER.slice();
  const tribe = pool[Math.floor(r() * pool.length)];
  const size = CHAL_SIZES[Math.floor(r() * CHAL_SIZES.length)];
  const difficulty = CHAL_DIFF[Math.floor(r() * CHAL_DIFF.length)];
  const opponents = 2 + Math.floor(r() * 4);
  const rivals = [];
  const fam = new Set([TRIBES[tribe].family]);
  const rest = AI_POOL.filter(k => k !== tribe);
  while (rivals.length < opponents && rest.length) {
    const k = rest.splice(Math.floor(r() * rest.length), 1)[0];
    if (fam.has(TRIBES[k].family)) continue;
    fam.add(TRIBES[k].family); rivals.push(k);
  }
  const par = 1600 + Math.round(r() * 500) + opponents * 120 + (difficulty === 'crazy' ? 500 : difficulty === 'hard' ? 250 : 0);
  return { id: day, day, week: weekId(new Date(day + 'T12:00:00')), seed, tribe, size, difficulty, opponents: rivals.length, rivals, par };
}
function chalState() {
  if (!PROFILE) loadProfile();
  const w = weekId();
  if (PROFILE.challenge.week !== w) { PROFILE.challenge = { week: w, days: {} }; saveProfile(); }
  return PROFILE.challenge;
}
function chalScore(day) { const d = chalState().days[day]; return d ? d.score : 0; }
function chalTotal() { const st = chalState(); return Object.keys(st.days).reduce((a, k) => a + (st.days[k].score || 0), 0); }

/* ---------- scoring ---------- */
function recordChallengeScore(ch, score, done) {
  if (!ch || !done) return null;
  const st = chalState();
  if (ch.week !== st.week) return { text: 'That run belonged to an earlier week.', bonus: 0 };
  const prev = st.days[ch.day];
  const first = !prev;
  const best = Math.max(score, prev ? prev.score : 0);
  st.days[ch.day] = { score: best, tribe: ch.tribe, at: Date.now(), runs: (prev ? prev.runs : 0) + 1 };
  saveProfile();
  let bonus = 0; const lines = [];
  if (first) {
    if (score >= ch.par * 1.4) { bonus = 2; lines.push(`Smashed the par score (${ch.par.toLocaleString()}): +2 Wins`); }
    else if (score >= ch.par) { bonus = 1; lines.push(`Beat the par score (${ch.par.toLocaleString()}): +1 Win`); }
    else lines.push(`Par for today was ${ch.par.toLocaleString()} — beat it tomorrow for bonus Wins.`);
  } else if (score > (prev ? prev.score : 0)) lines.push('New personal best for today — no extra Wins for repeat runs.');
  else lines.push('Practice run — your best score for today still stands.');
  return { text: lines.join(' '), bonus, best, first };
}

/* ---------- a believable weekly board, generated from the week seed ---------- */
function rivalBoard() {
  const w = weekId(), r = chalRng(strSeed('board:' + w)), rows = [];
  const days = weekDays().filter(d => d <= dayId()).length;
  const names = ['Kesh', 'Ravi', 'Tuuli', 'Marek', 'Noa', 'Ivo', 'Sable', 'Juno', 'Priya', 'Bex', 'Otto', 'Wren', 'Casi', 'Dax'];
  const used = new Set();
  for (let k = 0; k < 9; k++) {
    let n = names[Math.floor(r() * names.length)];
    while (used.has(n)) n = names[Math.floor(r() * names.length)] + Math.floor(r() * 90 + 10);
    used.add(n);
    const tribe = k === 0 ? LIMITED.tribe : TRIBE_ORDER[Math.floor(r() * TRIBE_ORDER.length)];
    const per = 900 + r() * 2600;
    let score = Math.round(per * Math.max(1, days) * (0.75 + r() * 0.5));
    if (k === 0) score = Math.round(score * 1.6 + 2200 * Math.max(1, days));   /* the limited tribe tops the board */
    rows.push({ name: n, tribe, score });
  }
  return rows;
}

/* ---------- stats / economy ---------- */
function statsHTML() {
  const ti = G.human;
  const tribes = G.tribes.slice().sort((a, b) => scoreOf(b.i) - scoreOf(a.i));
  const max = Math.max(1, ...tribes.map(t => scoreOf(t.i)));
  const bars = tribes.map(t => `<div class="brow"><span class="cmp"><i style="background:${t.color}"></i>${esc(t.name)}</span><span class="b"><i style="width:${scoreOf(t.i) / max * 100}%;background:${t.color}"></i></span><b style="text-align:right">${scoreOf(t.i).toLocaleString()}</b></div>`).join('');
  const rows = tribes.map(t => {
    const terr = G.tiles.filter(q => q.owner === t.i).length;
    return `<tr><td><span class="cmp"><i style="background:${t.color}"></i>${esc(t.name)}${t.i === ti ? ' (you)' : ''}</span></td><td>${t.alive ? 'Standing' : 'Destroyed'}</td><td>${citiesOf(t.i).length}</td><td>${unitsOf(t.i).length}</td><td>${terr}</td><td>${Object.keys(t.techs).length}</td><td>${t.kills}</td><td>${TRIBES[t.key].ability}</td></tr>`;
  }).join('');
  const inc = computeIncome(ti);
  const crow = citiesOf(ti).map(c => { const p = inc.per.get(c.id); return `<tr><td>${esc(c.name)}${c.capital ? ' ★' : ''}</td><td>${c.level}</td><td>${p.base}</td><td>${p.sites}</td><td><b>${p.base + p.sites}</b></td><td>${cityUnitCount(c)} / ${cityCapacity(c)}</td></tr>`; }).join('');
  const cnt = {}; G.tiles.forEach(t => { if (t.owner === ti && t.site && SITES[t.site.type]) cnt[t.site.type] = (cnt[t.site.type] || 0) + 1; });
  const sites = Object.keys(cnt).map(k => `<span class="tag">${SITES[k].name} × ${cnt[k]}</span>`).join(' ') || '<span class="note">No buildings yet — click a tile inside your borders to build one.</span>';
  return `<h2>Game stats</h2><p class="lead">Turn ${G.turn}${G.turnLimit ? ' of ' + G.turnLimit : ''} · ${G.mode === 'glory' ? 'Glory: highest score after 30 turns wins' : 'Conquest: capture every enemy city'} · ${DIFFICULTY[G.difficulty].name}</p>
    <div class="two"><div><div class="sec">Score</div><div class="bars" style="margin-top:8px">${bars}</div></div>
    <div><div class="sec">Your gold per turn</div><div class="cost" style="font-size:22px;margin:8px 0"><span>${ICON.gold} +${inc.gold}</span></div>
    <p class="note">Cities make ${inc.cities} · Buildings make ${inc.sites}</p><div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${sites}</div></div></div>
    <div class="sec" style="margin-top:18px">Your cities</div><div class="scroll-x"><table class="grid"><thead><tr><th>City</th><th>Level</th><th>City gold</th><th>Buildings</th><th>Total</th><th>Units</th></tr></thead><tbody>${crow || '<tr><td colspan="6">No cities</td></tr>'}</tbody></table></div>
    <div class="sec" style="margin-top:18px">Tribes</div><div class="scroll-x"><table class="grid"><thead><tr><th>Tribe</th><th>Status</th><th>Cities</th><th>Units</th><th>Territory</th><th>Techs</th><th>Kills</th><th>Ability</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- codex: units & counters ---------- */
function codexHTML() { return `<h2>Units &amp; counters</h2>` + codexBody(); }
function codexBody() {
  const who = inGame() ? G.human : UIState.opts.tribe;
  const types = TRAINABLE.concat(['champion']);
  const rows = types.map(k => {
    const T = UNITS[k];
    return `<tr><td><span class="cmp" style="gap:8px"><img src="${unitPortrait(k, who)}" alt="" style="width:40px;height:40px;margin:-8px 0"><b>${T.name}</b></span></td><td>${CLASS_NAME[T.cls]}</td><td>${T.hp}</td><td>${fmt1(T.atk)}</td><td>${T.def}</td><td>${T.mov}</td><td>${T.rng}</td>
      <td>${T.cost ? costHTML(T.cost, -1) : 'City reward'}</td><td>${T.tech ? TECHS[T.tech].name : '—'}</td>
      <td style="white-space:normal;min-width:180px">${strongList(k).map(q => UNITS[q].name).join(', ') || '—'}</td><td style="white-space:normal;min-width:150px">${weakList(k).map(q => UNITS[q].name).join(', ') || '—'}</td></tr>`;
  }).join('');
  const head = types.map(k => `<th title="${UNITS[k].name}"><img src="${glyphIcon(k, '#2b3a6c', '#fff')}" alt="${UNITS[k].name}"><small>${UNITS[k].name.slice(0, 5)}</small></th>`).join('');
  const mx = types.map(a => `<tr><th style="text-align:left!important"><span class="cmp" style="gap:6px"><img src="${glyphIcon(a, '#2b3a6c', '#fff')}" alt="" style="width:22px;height:22px;display:inline">${UNITS[a].name}</span></th>${types.map(d => {
    const m = counterMult(a, d, false);
    return m > 1 ? `<td class="s">×${m}</td>` : m < 1 ? `<td class="w">×${m}</td>` : '<td class="n">·</td>';
  }).join('')}</tr>`).join('');
  return `<p class="lead">Every unit is strong against something and weak against something else. A strong matchup multiplies that unit's attack <i>and</i> defence by ×1.5; the Swordsman is really weak against cavalry (×0.5).</p>
    <div class="scroll-x"><table class="grid"><thead><tr><th>Unit</th><th>Class</th><th>HP</th><th>ATK</th><th>DEF</th><th>Move</th><th>Range</th><th>Cost</th><th>Tech</th><th>Strong vs</th><th>Weak vs</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="sec" style="margin-top:20px">Counter matrix — row unit fighting column unit</div>
    <div class="scroll-x"><table class="grid mx"><thead><tr><th></th>${head}</tr></thead><tbody>${mx}</tbody></table></div>
    <div class="help"><h3>The rock-paper-scissors loop</h3><p><b>Spearmen</b> stop <b>cavalry</b> → <b>cavalry</b> runs down <b>Archers, Swordsmen and Catapults</b> → <b>Swordsmen</b> beat every <b>foot unit</b> → <b>Archers</b> shred <b>Spearmen and Warriors</b> from 3 tiles away → <b>Shieldbearers</b> block arrows → <b>Catapults</b> smash Shieldbearers and cities.</p>
    <h3>How damage works</h3><p>Attack force = ATK × counter bonus × (HP ÷ max HP). Defence force = DEF × counter bonus × (HP ÷ max HP) × terrain bonus. Damage dealt = attack share × ATK × 4.5. If the defender survives and you're inside its range, it strikes back with its defence share. Wounded units hit softer — heal them!</p>
    <h3>Defence bonuses</h3><ul><li>In your own city ×1.5 · with City Walls ×2.5</li><li>Forest ×1.25 (×1.5 after Archery) · Mountain ×1.5</li><li>Units in boats fight with fixed boat stats and no counter bonuses.</li></ul>
    <p>Hover (or tap) an enemy while your unit is selected to see the exact forecast before you attack.</p></div>`;
}

/* ---------- overlay & modal clicks ---------- */
function setupDelegates() {
  $('#ovClose').addEventListener('click', closeOverlay);
  $('#overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeOverlay(); });
  $('#ovBody').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const a = b.dataset.act;
    if (a === 'techSel') ttSelect(b.dataset.key);
    else if (a === 'research') ttResearch(b.dataset.key);
    else if (a === 'upgrade') upgradeBuy(b.dataset.key);
  });
  $('#panel').addEventListener('click', onPanelClick);
  $('#modalBody').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const a = b.dataset.act;
    if (a === 'reward') { const c = G.cities[+b.dataset.city]; closeModal(); chooseReward(c, b.dataset.id); sfx('reward'); afterAction(); }
    else if (a === 'confirmYes') { const cb = modalCb; closeModal(); if (cb) cb(); }
    else if (a === 'confirmNo' || a === 'closeModal' || a === 'resume') closeModal();
    else if (a === 'toMenu') { closeModal(); toMenu(); }
    else if (a === 'newGame') { closeModal(); toMenu(); showSetup(); }
    else if (a === 'howto') { closeModal(); openOverlay('help'); }
    else if (a === 'shopPlay') { closeModal(); closeShop(); showSetup(); }
    else if (a === 'toChallenge') { closeModal(); toMenu(); openChallenge(); }
    else if (a === 'set') {
      const k = b.dataset.k, v = b.dataset.v, S = UIState.settings;
      if (k === 'speed') { S.speed = +v; SPEED = S.speed === 2 ? 0.45 : S.speed === 0 ? 0.05 : 1; }
      else S[k] = v === '1';
      saveSettings(); syncMusic(); openGameMenu();
    }
  });
  $('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal' && !$('#modalBody').querySelector('[data-act="reward"]') && !(G && G.over)) closeModal(); });
}
function onPanelClick(e) {
  const b = e.target.closest('[data-act]'); if (!b || !G) return;
  if (b.disabled || b.getAttribute('aria-disabled') === 'true') { sfx('bad'); return; }
  const a = b.dataset.act, s = UIState.sel;
  const u = s && s.kind === 'unit' ? unitById(s.id) : null;
  const c = s && s.kind === 'city' ? G.cities[s.id] : null;
  if (a === 'close') return clearSel();
  if (!isHumanTurn()) return;
  if (a === 'capture' && u) { if (doCapture(u)) afterAction(); }
  else if (a === 'recover' && u) { if (doRecover(u)) afterAction(); }
  else if (a === 'paidHeal' && u) { if (doPaidHeal(u)) afterAction(); }
  else if (a === 'rankUp' && u) { if (doRankUp(u)) afterAction(); }
  else if (a === 'skip' && u) { doSkip(u); afterAction(); selectNextReady(); }
  else if (a === 'monkHeal' && u) { if (doMonkHeal(u)) afterAction(); }
  else if (a === 'disband' && u) confirmModal('Disband this unit?', `The ${UNITS[u.type].name} will be removed for good, freeing a unit slot in its home city.`, 'Disband', () => { doDisband(u); clearSel(); renderTopbar(); });
  else if (a === 'confirmAttack' && u) { const e2 = unitById(UIState.armed); UIState.armed = null; if (e2) actAttack(u, e2); }
  else if (a === 'train' && c) { if (doTrain(c, b.dataset.type)) afterAction(); }
  else if (a === 'walls' && c) { if (doBuyWalls(c)) { sfx('build'); afterAction(); } }
  else if (a === 'openReward') checkRewards();
  else if (a === 'tile') { const i = +b.dataset.i; if (doTileAction(G.human, tx(i), ty(i), b.dataset.id)) { sfx('build'); afterAction(); } }
}
function openGameMenu() {
  const S = UIState.settings;
  const seg = (k, opts, cur) => `<div class="seg">${opts.map(([v, l]) => `<button data-act="set" data-k="${k}" data-v="${v}" class="${String(cur) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  showModal(`<h2>Menu</h2><div class="opt"><label>Animation speed</label>${seg('speed', [[1, 'Normal'], [2, 'Fast'], [0, 'Instant']], S.speed)}</div>
    <div class="opt"><label>Warn when units can still act</label>${seg('warnReady', [[1, 'On'], [0, 'Off']], S.warnReady ? 1 : 0)}</div>

    <div class="opt"><label>Music</label>${seg('music', [[1, 'On'], [0, 'Off']], S.music ? 1 : 0)}</div>
    <div class="opt"><label>Sound effects</label>${seg('sound', [[1, 'On'], [0, 'Off']], S.sound ? 1 : 0)}</div>
    <div class="modal-actions"><button class="btn" data-act="howto">How to play</button><button class="btn" data-act="toMenu">Save &amp; main menu</button><button class="btn primary" data-act="resume">Resume</button></div>`);
}
function saveSettings() { try { localStorage.setItem('tessera-settings', JSON.stringify(UIState.settings)); } catch (e) { /* storage unavailable */ } }
function loadSettings() {
  try { const s = JSON.parse(localStorage.getItem('tessera-settings') || 'null'); if (s) Object.assign(UIState.settings, s); } catch (e) { /* ignore */ }

  const items = [['bMenu', 'menu', 'Menu', () => openGameMenu()], ['bTech', 'tech', 'Tech', () => openOverlay('tech')], ['bUpgrades', 'armory', 'Upgrades', () => openOverlay('upgrades')],

/* ---------- save / load ---------- */
/* challenge runs are saved under their own key so they never overwrite a normal game */
const CHALLENGE_RUN_KEY = 'tessera-challenge-run';
function saveGame() {
  if (!G || G.allAI || G.over) return;
  try { localStorage.setItem(G.challenge ? CHALLENGE_RUN_KEY : SAVE_KEY, JSON.stringify(G)); } catch (e) { /* storage unavailable */ }
}
function loadSave() {
  try { const s = localStorage.getItem(SAVE_KEY); if (!s) return null; const g = JSON.parse(s); return g && g.v === 2 && g.tribes && !g.over && !g.challenge ? g : null; }
  catch (e) { return null; }
}
function clearSave() { try { localStorage.removeItem(G && G.challenge ? CHALLENGE_RUN_KEY : SAVE_KEY); } catch (e) { /* ignore */ } }
